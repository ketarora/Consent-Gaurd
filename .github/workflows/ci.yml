name: Consent Guard CI

on:
  pull_request:
  push:
    branches:
      - main
      - improve/eval-docs
      - copilot/improveeval-docs

permissions:
  contents: read

jobs:
  backend-tests-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/tests -q

      - name: Run dataset eval script
        run: python eval/run_eval.py --input consent_guard_dataset.json --out /tmp/consent-guard-results.json --clean --cleaned-out /tmp/consent-guard-cleaned.json

      - name: Run deterministic latency benchmark
        run: python eval/benchmark_latency.py --input consent_guard_dataset.json --out /tmp/consent-guard-latency.json --iterations 10

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
