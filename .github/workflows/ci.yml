name: Consent Guard CI

on:
  pull_request:
  push:
    branches:
      - main
      - improve/eval-docs
      - copilot/improveeval-docs

jobs:
  backend-tests-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/tests -q

      - name: Run dataset eval script
        run: python eval/run_eval.py --input consent_guard_dataset.json --out /tmp/consent-guard-results.json --clean --cleaned-out /tmp/consent-guard-cleaned.json
