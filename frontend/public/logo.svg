<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Minimalist Silver / Titan Gradient -->
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    
    <!-- Deep Electric Blue Gradient -->
    <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Deep Midnight Outer App Icon Canvas -->
  <rect width="120" height="120" rx="28" fill="#020617"/>
  <rect width="120" height="120" rx="28" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  
  <!-- Geometric Abstraction: Slanted Data Nodes representing Auditing & Telemetry -->
  <g transform="translate(60, 60) rotate(-45) translate(-60, -60)">
    
    <!-- Primary Guard Block -->
    <rect x="32" y="30" width="18" height="60" rx="9" fill="url(#grad1)"/>
    
    <!-- Core Analytics Center Block -->
    <rect x="56" y="20" width="18" height="80" rx="9" fill="url(#grad1)"/>
    
    <!-- Actionable Compliance Node (Blue) -->
    <rect x="80" y="45" width="12" height="30" rx="6" fill="url(#gradBlue)">
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
