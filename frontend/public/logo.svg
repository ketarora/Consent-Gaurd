<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#3B82F6"/>
        </linearGradient>
        <linearGradient id="shieldDark" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#334155" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Outer Shield Boundary -->
    <path d="M 60 10 L 15 25 L 15 65 C 15 90 40 105 60 115 C 80 105 105 90 105 65 L 105 25 Z" 
          fill="url(#shieldDark)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
          
    <path d="M 60 10 L 15 25 L 15 65 C 15 90 40 105 60 115 C 80 105 105 90 105 65 L 105 25 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="2" filter="url(#glow)"/>

    <!-- Inner Geometry Grid -->
    <path d="M 60 28 L 30 40 L 30 70 C 30 85 45 95 60 100 C 75 95 90 85 90 70 L 90 40 Z" 
          fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Neural Beams linking Core -->
    <path d="M 30 40 L 60 55 L 90 40 M 60 55 L 60 100" 
          stroke="url(#shieldGrad)" stroke-width="2" fill="none" opacity="0.8"/>
          
    <path d="M 15 65 L 60 85 L 105 65" 
          stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" fill="none" />

    <!-- Core Authorization Node -->
    <circle cx="60" cy="55" r="8" fill="#3B82F6" filter="url(#coreGlow)"/>
    <circle cx="60" cy="55" r="4" fill="#FFFFFF"/>
</svg>
